<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이 픽사베이</title>
</head>
<body>
    <h1>이미지 검색</h1>
    <form action="/search" method="get" id="searchForm">
        <input type="text" name="q" placeholder="예) cat, dog, pet" required id="query">
        <input type="submit" value="검색">
    </form>

    <div id="result">
        <!-- 결과 이미지로 채울 공간 -->
    </div>
    
    <script>
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault(); // 원래 하던 폼 전송 후 리프레쉬 막기
            const query = document.getElementById('query').value;
            // console.log(query)

            fetch(`/search?q=${encodeURIComponent(query)}`) //요청한다
                // .then(response => console.log(response))
                .then(response => response.json()) // 요청해서 받아온 응답을 json으로 파싱한다.
                .then(data => { // 파싱이 끝난 내용을 data라는 변수로 담아와서 처리한다.
                    console.log(data)
                    const resultDiv = document.getElementById('result');
                    resultDiv.innerHTML = '' // 초기화

                    if (data.imgs.length == 0) {
                        resultDiv.innerHTML = '<p>검색결과가 없습니다.<p>'
                    }

                    data.imgs.forEach(item => {
                        console.log(item['url'])
                        resultDiv.innerHTML += `<img src='${item['url']}'><p>${item.filename}</p>`
                    })
                })
        })
    </script>

</body>
</html>
