<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <style>
        table, th, tr, td {
            border-collapse: collapse;
            border: 1px solid black;
            text-align: center;
        }
        table {
            width: 100%;
            table-layout: fixed;
        }
        th:first-child {
            width: 150px;
            padding: 5px;
        }
        td:first-child img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1>이미지 업로드</h1>
    <form action="/api/upload" method="post" enctype="multipart/form-data" id="upload">
        <input type="file" name="img">
        <input type="submit" value="이미지 업로드">
    </form>
    <h2>이미지 목록</h2>
    <table id="image_list">
        <tr>
            <th>미리보기</th>
            <th>파일명</th>
            <th>키워드</th>
            <th>삭제</th>
        </tr>

    </table>

    <script>
    // 서버에 저장된 이미지 파일에 대한 정보를 달라고 요청
    fetch('/api/send_images') // 정보 달라고 요청
        // .then(response => console.log(response))
        .then(response => response.json()) // 서버에서 보낸 response를 json으로 파싱
        .then(data => {
            console.log('data: ', data.data)
            console.log('이미지 데이터 받았어?')
            const image_list = document.getElementById('image_list');

            data.data.forEach(img => {
                console.log(img.tag)
                image_list.innerHTML += `<tr>
                    <td><img src="${img.url}"></td>
                    <td>${img.filename}</td>
                    <td>
                        <form action='/api/edit_tag/${img.filename}' method='post'>
                            <input type='text' name='tag' value=${img.tag}>
                            <button type=submit>수정</button>
                        </form>
                    </td>
                    <td><a href='/api/delete/${img.filename}'>삭제</a></td></tr>`
            })
        });
    

    </script>    
</body>
</html>
