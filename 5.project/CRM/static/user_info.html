<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 상세정보</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        #pages a {
            margin: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Login</a>
        <a href="/users">Users</a>
        <a href="/stores">Stores</a>
        <a href="/orders">Orders</a>
        <a href="/items">Items</a>
        <a href="/orderitems">Orderitems</a>
    </nav>
    <hr>
    <a href="javascript:history.back()">뒤로가기</a>
    <h3>사용자 상세 정보</h3>    
    <table id="user">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Birthdate</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <!-- 사용자 정보 뜨는 곳 -->
        </tbody>
    </table>
    <h3>사용자의 주문내역</h3>    
    <table id="order_history">
        <tr>
            <td>order_id</td>
            <td>ordertime</td>
            <td>store</td>
            <td>item</td>
        </tr>
        <tr>
            <!-- 주문 내역 뜨는 곳 -->
        </tr>
    </table>
    
    <h3>자주 방문한 매장 Top 5</h3> 
    <ol id="store_top5">
        <!-- 매장 리스트 -->
    </ol>
    <h3>자주 주문한 상품명 Top 5</h3>
    <ol id="item_top5">
        <!-- 상품 리스트 -->
    </ol> 


    <script>
        const user = document.getElementById('user')
        const tbody = document.getElementById('tbody')
        const store_top5 = document.getElementById('store_top5')
        const item_top5 = document.getElementById('item_top5')

        const url2 = window.location.href
        // console.log(url2)
        const url = window.location.pathname
        // console.log(url)
        const last = url.split('/')
        // console.log(last)
        const userid = last[last.length - 1] 
        // console.log(userid)

        // fetch로 쿼리 정보 받아오기
        fetch(`/users/api/user_info/${userid}`)
            .then(response => response.json())
            .then(data => {
                console.log(data)
                const new_tr = document.createElement('tr')
                    new_tr.innerHTML = `<td>${data.id}</td>
                                        <td>${data.name}</td>
                                        <td>${data.birthdate}</td>
                                        <td>${data.age}</td>
                                        <td>${data.gender}</td>
                                        <td>${data.address}</td>`
                    tbody.appendChild(new_tr)
            }
        )
        // 사용자의 주문내역 받아오기
        fetch(`/users/api/order_history/${userid}`)
            .then(response => response.json())
            .then(data => {
                console.log(data)
                for (u of data) {
                    const new_tr = document.createElement('tr')
                    new_tr.innerHTML = `<td><a href="/orders/info/${u.order_id}">${u.order_id}</td>
                                        <td>${u.ordertime}</td>
                                        <td>${u.store}</td>
                                        <td>${u.item}</td>`
                    order_history.appendChild(new_tr)
                }
            })
        
        fetch(`/users/api/store_top5/${userid}`)
            .then(response => response.json())
            .then(data => {
                console.log(data[0])
                for (i of data) {
                    const new_li = document.createElement('li')
                    new_li.innerText = `${i.store} : ${i.cnt}번 방문`
                    store_top5.appendChild(new_li)
                }
            }
            )
        
        fetch(`/users/api/item_top5/${userid}`)
            .then(response => response.json())
            .then(data => {
                for (i of data) {
                    const new_li = document.createElement('li')
                    new_li.innerText = `${i.item} : ${i.cnt}번 구매` 
                    item_top5.appendChild(new_li)                    
                }
            })

    </script>
    </body>
    </html>
