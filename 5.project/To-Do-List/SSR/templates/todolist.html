<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        /* ul {
            display:flex;
            justify-content: left;
            align-items:left;
            flex-direction:column;           
        } */
        body {
            display:flex;
            flex-direction: column;
            align-items: center;
            justify-content:center;
            margin:0;
            padding:0;
        }
        #container {
            display: flex;
            flex-direction: column;
            justify-content:center;
            align-items:center;
            border: 1px solid;
            width: 400px;
            margin:0;
            padding:0;
        }
        #input-container {
            width: 100%;
            margin:0;
            padding:10px;
            display: flex;
            justify-content:center;
        }        
        #input-container button {
            margin:5px;
            padding:5px;
        }
        form {
            width: 100%;
        }
        input {
            height: 30px;
            width: 80%;
            margin:5px;
        }
        #list-container  {
            width: 100%;
            margin: 0;
            padding:0;
        }
        ul {
            padding:10;
            margin:0;
        }
        li {
            width:fit-content; /* 이거 하나 쓰니까 리스트항목 눌렀을 때만 클릭이벤트 적용됨. 공백눌러도 작동x*/
            margin-top:0;
        }
        li .status {
            text-decoration: none;
            color: black;
        }
        li .delete {
            margin: 5px;
            padding:2px;
            background-color:transparent;
            border:0;
            color:red;
        }
    </style>
</head>
<body>
    <h1>To Do List</h1>
    <p>서버사이드 렌더링</p>
    <div id="container">
        <div id="input-container">
            <form action="/add" method="post">
                <input type="text" id="userInput" name='todo' placeholder="오늘 할 일?">
                <button type=submit id="addTodo">추가</button>
            </form>
        </div>
        <div id="list-container">
            <ul id="todoList">
                {% for todo in todolist %}
                    {% if todo['status']==1 %}
                        <li><a href='/edit_status/{{ todo['id'] }}' class='status' style="text-decoration: line-through;">{{ todo['todo'] }}</a><a href='/delete/{{ todo['id'] }}' class="delete">x</a></li>
                    {% else %}
                        <li><a href='/edit_status/{{ todo['id'] }}' class='status'>{{ todo['todo'] }}</a><a href='/delete/{{ todo['id'] }}' class="delete">x</a></li>
                    {% endif %}
                {% endfor %}
            </ul>
        </div>
    </div>
    

</body>
</html>
