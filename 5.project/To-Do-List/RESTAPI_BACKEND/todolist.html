<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        /* ul {
            display:flex;
            justify-content: left;
            align-items:left;
            flex-direction:column;           
        } */
        body {
            display:flex;
            flex-direction: column;
            align-items: center;
            justify-content:center;
            margin:0;
            padding:0;
        }
        #container {
            display: flex;
            flex-direction: column;
            justify-content:center;
            align-items:center;
            border: 1px solid;
            width: 400px;
            margin:0;
            padding:0;
        }
        #input-container {
            width: 100%;
            margin:0;
            padding:10px;
            display: flex;
            justify-content:center;
        }        
        #input-container button {
            margin:5px;
            padding:5px;
        }
        form {
            width: 100%;
        }
        input {
            height: 30px;
            width: 80%;
            margin:5px;
        }
        #list-container  {
            width: 100%;
            margin: 0;
            padding:0;
        }
        ul {
            padding:10;
            margin:0;
        }
        li {
            width:fit-content; /* 이거 하나 쓰니까 리스트항목 눌렀을 때만 클릭이벤트 적용됨. 공백눌러도 작동x*/
            margin-top:0;
        }
        li button {
            margin: 5px;
            padding:2px;
            background-color:transparent;
            border:0;
            color:red;
        }
    </style>
</head>
<body>
    <h1>To Do List</h1>
    <p>서버사이드 렌더링</p>
    <div id="container">
        <div id="input-container">
            <input type="text" id="userInput" name='todo' placeholder="오늘 할 일?">
            <button type=submit id="addTodo">추가</button>
        </div>
        <div id="list-container">
            <ul id="todoList"></ul>
        </div>
    </div>
    

    <script>
        // 1. 데이터 불러오기 : 시작 시 로드..
        // 2. 데이터 삭제하기
        // 3. 데이터 추가하기

        const todoList = document.getElementById('todoList');
        const addTodo = document.getElementById('addTodo');
        const Input = document.getElementById('userInput');
        
        // 버튼 클릭 시 투두리스트 추가 
        addTodo.addEventListener('click', (e) => {
            const userInput = document.getElementById('userInput').value;
            const new_li = document.createElement('li');
            console.log('서버로 보낼 내용 및 투두리스트에 추가할 내용: ', userInput)
            fetch('/add',{
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({'todo':userInput, 'status':'not_complete'})
            })
            
            if (userInput == ''){ // 빈 값일 경우 추가 버튼 눌리지 않게.? 리스트 추가 되지 않게..
                return;
            }
            //리스트 추가
            new_li.textContent = userInput;
            todoList.appendChild(new_li);   
            console.log('투두리스트 추가됐니?')
            
            //삭제버튼도 추가
            const del_btn = document.createElement('button')
            del_btn.textContent = 'x'
            new_li.appendChild(del_btn)
            
            document.getElementById('userInput').value = ''; //DOM 요소를 직접 수정하는 것 //엔터 치면 인풋 밸류 사라지기
            // userInput = ''; userInput 변수에 저장된 값을 바꾸려는 것! 
        })
        
        // 엔터 치면 추가 버튼 클릭 기능 활성화. input에 대해서 keydown 이벤트를 등록해야할지, 버튼에 대해서 등록해야할지??
        Input.addEventListener('keydown', function(e){
            if (e.key == 'Enter'){
                // 버튼 클릭 이벤트를 활성화시켜야....
                addTodo.click();
            }
        })


        todoList.addEventListener('click', function(e){ 
            console.log(e.target.closest('li')); // 해당 버튼과 가장 가까운 리스트 찾음.
            
            const li = e.target.closest('li');
            const todoText = Array.from(li.childNodes)
            .filter(node => node.nodeType === Node.TEXT_NODE)
            .map(node => node.textContent.trim())
            .join('').trim();
            console.log(todoText); // 해당 버튼과 가장 가까운 리스트 찾음.
            
            if (e.target.tagName === 'LI'){  // li는 블럭 요소. 옆에 공백 눌렀을 땐 작동x. 클릭 부분이 ul이 아닌 li인 경우로 제한
                // 클릭하며 텍스트 중간에 줄 긋기. text-decoration=line-through
                if (e.target.style.textDecoration == 'line-through') { // 순서 반대로 하면 안 됨. style이 처음엔 아예 지정이 안 되어있어서 그런건지 뭔지 ''으로 해도 'none'으로해도 true가 되지 않음....
                e.target.style.textDecoration ='none';
                fetch('/edit_status',{
                    method: 'put',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({'todo': todoText, 'status':'not_complete'})
                })
            } else {e.target.style.textDecoration = 'line-through';
            fetch('/edit_status',{
                method: 'put',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({'todo': todoText, 'status':'complete'})
            })
        }
    } else {
        // console.log(e.target.tagName)
            }
            //삭제 기능 추가
            if (e.target.tagName === 'BUTTON'){
                
                li.remove();
                fetch('/delete',{
                    method: 'delete',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({'todo': todoText})
                })
            }
        })       
        
        function load_data(){
            fetch('/send_data')
            .then(response => response.json())
            .then(data => {
                    console.log(data.data)
                    for (const todo of data.data){
                        console.log(todo['todo'])
                        const new_li = document.createElement('li');
                        new_li.textContent = todo['todo'];
                        todoList.appendChild(new_li);
                        console.log('추가됐나?');
                        //삭제버튼도 추가
                        const del_btn = document.createElement('button')
                        del_btn.textContent = 'x';
                        new_li.appendChild(del_btn);
                        if (todo['status'] == 'complete'){
                            new_li.style.textDecoration = 'line-through';
                        }
                    }
                })
            }

        load_data()
    </script>
</body>
</html>
