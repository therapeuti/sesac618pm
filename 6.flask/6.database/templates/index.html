<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h2>사용자 목록</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>나이</th>
                <th>작업</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.id }}</td> 
                <td>{{ u.name }}</td>
                <td>{{ u.age }}</td>
                <td>
                    <a href='/update/{{ u.id }}'>수정</a>
                    <a href='/delete/{{ u.id }}'>삭제</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h3>새 사용자 추가</h3>
    <form method="POST"> <!-- 경로를 따로 지정하지 않았기 때문에 실행한 그 페이지 경로로 전달-->
        이름: <input type="text" name="name" required>
        나이: <input type="number" name="age" required>
        <button type="submit">추가</button>
    </form>
    
</body>
</html>
