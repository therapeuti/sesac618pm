{% extends "base.html" %}

{% block title %} 장바구니 페이지 {% endblock%}

{% block content %}
<h1>장바구니</h1>
<table style="text-align: center;">
    <tr>
        <th>상품ID</th>
        <th>이름</th>
        <th>가격</th>
        <th>수량</th>
        <th>상품별 합계금액</th>
        <th></th>
    </tr>
{% for item in items_in_cart %}
    <tr>
        <td>{{item.id}}</td>
        <td>{{item.name}}</td>
        <td>{{item.price}}</td>
        <td><a href="/subtraction/{{item.id}}">-</a>{{item.count}}<a href="/plus/{{item.id}}">+</a></td>
        <td>{{item.count * item.price}}</td>
        <td><a href="/delete_row/{{item.id}}">삭제</a></td>
    </tr>
    {% endfor %}
</table>
<br>
<h4>총 합계: {{total_price}}원</h4>
<a href="/empty_cart">장바구니 비우기</a>
{% endblock %}
