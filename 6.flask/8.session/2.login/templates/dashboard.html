<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 프로필</title>
</head>
<body>
    <h3>안녕하세요, {{user_name}}님 <a href="{{url_for('edit_page')}}">프로필 수정</a></h3>
    {% with message = get_flashed_messages() %}
        {% if message %}
            {% for msg in message %}
                <p>{{msg}}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/logout">
        <label for="logout"></label>
        <input type="submit" id="logout" value="로그아웃">
    </form>
    
</body>
</html>
