<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
</head>
<body>
    <h1>상품페이지</h1>
    <label for="languageSelect"><strong>Language</strong></label>
    <select id="languageSelect">
        <option value="korean">한국어</option>
        <option value="english">영어</option>
        <option value="japanese">일본어</option>
        <option value="french">프랑스어</option>
        <option value="italian">이탈리어</option>
        <option value="spanish">스페인어어</option>
    </select>
    <div class="prod-image">
        <img src="https://picsum.photos/600/400" alt="상품이미지">
    </div>

    <div class="review-form">
        <div>
            <h4>Write a Review</h4>
            <p>Rating</p>
            <label><input type="radio" name="rating" value="1">1</label>
            <label><input type="radio" name="rating" value="2">2</label>
            <label><input type="radio" name="rating" value="3">3</label>
            <label><input type="radio" name="rating" value="4">4</label>
            <label><input type="radio" name="rating" value="5">5</label>
        </div>
        <textarea id="opinion" placeholder="의견을 작성해주세요" rows="5" cols="40"></textarea>
        <button onclick="submitReview()">리뷰 제출</button>
    </div>
    <div>
        <h2>후기</h2>
        <div id="reviews-container">
            <div id="ai-summary">
                <!-- <p><strong>AI 요약:</strong>아직 리뷰가 없습니다.</p>
                <p><strong>평균 별점:</strong>N/A</p> -->
            </div>
            <div id="reviews">

            </div>
        </div>
    </div>
</body>
</html>
