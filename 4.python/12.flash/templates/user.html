{% extends "base.html" %}

{% block title %} 사용자 페이지 {% endblock%}

{% block content %}
<h1>사용자</h1>
<p>안녕하세요, {{user.name}}님</p>
{% with message = get_flashed_messages() %}
        {% if message %}
            {% for msg in message %}
                <p>{{ msg }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
{% endblock %}
