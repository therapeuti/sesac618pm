<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="load">정보 GET 요청</button>
    <div id="result"></div>
    <button id="create">정보 생성 요청</button>
    <button id="delete">정보 삭제 요청</button>
    <button id="modify">정보 수정 요청</button>

    <script>
        document.getElementById('modify').addEventListener('click', () => {
            const updateData = {
                id: 1,
                title: 'foo',
                body: 'bar',
                userId:1
            }
            fetch('https://jsonplaceholder.typicode.com/posts/111', {
                method: 'PUT',
                body: JSON.stringify(updateData),
                headers: { "content-type": 'application/json; charset=UTF-8'}
            })
                .then(response => response.json())
                .then(json => document.getElementById('result').innerText = JSON.stringify(json, null, 2))
        })

        document.getElementById('delete').addEventListener('click', () => {
            fetch('https://jsonplaceholder.typicode.com/posts/1', {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(json => document.getElementById('result').innerText = JSON.stringify(json, null, 2))
        })

        document.getElementById('create').addEventListener('click', () => {
            const newData = {
                title: "Hello, SESAC",
                body: "안녕하세요",
                userId: 5,
            }
            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                headers: { // 옵셔널한 거지만, 바디 포맷과 언어 등을 넣어주는 것이 좋음.
                    'content-type':'application/json; charset=UTF-8'
                },
                body: JSON.stringify(newData) // 문자열로 만들어서 보냄.
            })
                .then(response => response.json())
                .then(json => document.getElementById('result')).innerText = JSON.stringify(json, null, 2)
        })


        document.getElementById('load').addEventListener('click', () => {
            console.log('버튼클릭')
            fetch('https://jsonplaceholder.typicode.com/posts/1') // 기본값은 get
                .then(response => response.json()) // 한 줄로 간단하게 적은 것
                .then(json => {
                    console.log(JSON.stringify(json, null, 2))
                    document.getElementById('result').innerText = JSON.stringify(json, null, 2)
                })
                    
        })
        console.log('fetch 이후')
    </script>
</body>
</html>
