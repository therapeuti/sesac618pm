<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="load">정보 GET 요청</button>
    <div id="result"></div>
    <button id="create">정보 생성 요청</button>
    <button id="delete">정보 삭제 요청</button>
    <button id="modify">정보 수정 요청</button>

    <script>
        document.getElementById('modify').addEventListener('click', async () => {
            const updateData = {
                id: 1,
                title: 'foo',
                body: 'bar',
                userId:1
            }
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/11', {
                    method: 'PUT',
                    body: JSON.stringify(updateData),
                    headers: { "content-type": 'application/json; charset=UTF-8'}
                })
                const json = await response.json()
                document.getElementById('result').innerText = JSON.stringify(json, null, 2)
            } catch(error) {
                document.getElementById('result').innerHTML = '<p style="color: red">요청 실패</p>'
            }
        })

        document.getElementById('delete').addEventListener('click', async () => {
            try {

                const response = await fetch('https://jsonplaceholder.typicode.com/posts/1', {
                    method: 'DELETE'
                })
                const json = await response.json()
                document.getElementById('result').innerText = await JSON.stringify(json, null, 2)
            } catch {
                document.getElementById('result').innerHTML = '<p style="color: red">요청 실패</p>'
            }
        })

        document.getElementById('create').addEventListener('click', async () => {
            const newData = {
                title: "Hello, SESAC",
                body: "안녕하세요",
                userId: 5,
            }
            try {

                const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST',
                    headers: { // 옵셔널한 거지만, 바디 포맷과 언어 등을 넣어주는 것이 좋음.
                        'content-type':'application/json; charset=UTF-8'
                    },
                    body: JSON.stringify(newData) // 문자열로 만들어서 보냄.
                })
                const json = await response.json()
                document.getElementById('result').innerText = JSON.stringify(json, null, 2)
            } catch {
                document.getElementById('result').innerHTML = '<p style="color: red">요청 실패</p>'
            }
        })


        document.getElementById('load').addEventListener('click', async () => {
            console.log('버튼클릭')
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/1') // 기본값은 get
                const json = await response.json() // 한 줄로 간단하게 적은 것
                document.getElementById('result').innerText = JSON.stringify(json, null, 2)
            } catch {
                document.getElementById('result').innerHTML = '<p style="color: red">요청 실패</p>'
            }
                })
    </script>
</body>
</html>
