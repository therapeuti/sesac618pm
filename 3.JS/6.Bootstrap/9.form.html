<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>
<body>
    <div class="container my-4">
        <!-- 텍스트 입력 -->
        <div class="mb-3">
            <label for="textInput" class="form-label">텍스트 입력: </label>
            <input type="text" class="form-control" id="textInput" placeholder="텍스트를 입력하시오.">
        </div>

        <!-- 이메일 입력 -->
        <div class="mb-3">
            <label for="emailInput" class="form-label">이메일 입력: </label>
            <input type="email" class="form-control" id="emailInput" placeholder="name@domain.com">
        </div>

        <!-- 체크박스 -->
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="checkbox1">
            <label for="checkbox1" class="form-check-label">여기를 체크</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="checkbox1">
            <label for="checkbox1" class="form-check-label">여기를 체크</label>
        </div>

        <!-- 라디오 버튼 -->
        <div class="form-check">
            <input type="radio" class="form-check-input" name="radioOptions" id="radio1">
            <label for="radio1" class="form-check-label">radio1</label>
        </div>
        <div class="form-check">
            <input type="radio" class="form-check-input" name="radioOptions" id="radio2">
            <label for="radio2" class="form-check-label">radio2</label>
        </div>

        <!-- 입력 필드 상태 표시 -->
         <div class="container my-4">
            <form novalidate>
                    <div class="mb-3">
                        <label for="validInput" class="from-control">올바른 입력값 예제</label>
                        <input type="text" class="form-control is-valid" id="validInput" placeholder="This is valid">
                    </div>
                    <div class="mb-3">
                        <label for="validInput" class="from-control">잘못된 입력값 예제</label>
                        <input type="text" class="form-control is-invalid" id="invalidInput" placeholder="This is invalid">
                        <div>올바른 값을 입력하시오</div>
                    </div>
            </form>
         </div>

        <input type="submit">





    </div>
</body>
</html>
