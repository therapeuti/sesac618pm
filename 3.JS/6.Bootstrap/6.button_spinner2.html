<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <button id="loadButton1" class="btn btn-primary my-5 ms-5" type="button">
        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        <span class="button-text">데이터 로딩</span>
    </button>
    <button id="clear" class="btn btn-danger my5" type="button" disabled="true">Clear</button>
    <div class="container-md mt-5 alert alert-primary" role="alert" id="result">
    <div class="alert alert-warning" role="alert"><!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        
    </body>
    </html></div>
        <!-- 데이터 불러와서 출력 -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script>
        const loadButton = document.getElementById('loadButton1')
        const clearButton = document.getElementById('clear')
        const spinner1 = loadButton.querySelector('.spinner-border')
        const buttonText = loadButton.querySelector('.button-text')

        loadButton.addEventListener('click', async () => {
            spinner1.disalbed = true;
            spinner1.classList.remove('d-none')
            const response = await fetch('https://jsonplaceholder.typicode.com/posts/5')
            const json = await response.json()
            document.getElementById('result').innerText = JSON.stringify(json, null, 2)
            spinner1.classList.add('d-none')
            clearButton.disabled = false
        })

        clearButton.addEventListener('click', () => {
            document.getElementById('result').innerText = ''
            clearButton.disabled = true
        })
    </script>
</body>
</html>
