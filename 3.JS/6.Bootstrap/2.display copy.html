<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap css 추가 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <!-- mt mb ms(left) me(right) my ms m -->
    <h2 class="mt-3">헤딩 사이즈2</h2>

    <section calss="mb-20">
        <h4> d-* 클래스 </h4>
        <!-- dispaly 클래스 (d-*) -->
         <div class="d-block bg-light p-2">d-block 블럭요소</div>
         <div class="d-inline bg-black text-white border p-2">d-block 인라인요소</div>
         <div class="d-inline bg-warning">d-block 인라인요소</div>

    </section>
    <section class="mb-20">
        <h3>visible/invisible</h3>
        <div class="bg-success text-white p-2 mb-2 ">항상 보이는 요소</div>
        <div class="bg-success text-white p-2 mb-2 invisible">안 보이는 요소 (공간은 차지함)</div>
        <div class="bg-success text-white p-2 mb-2 ">항상 보이는 요소</div>
    </section>

    <section>
        <h3> 추가적인 d-none 및 d-* 클래스  </h3>
        <div class="d-none">이건 안 보임</div>
        <div class="d-sm-block d-md-none d-lg-none bg-primary text-white p-2">이건 작은 화면에서만 보임</div>
        <div class="d-sm-none d-md-block d-lg-none bg-success text-white p-4">이건 중간 화면에서만 보임</div>
        <div class="d-sm-none d-md-none d-lg-block bg-secondary text-white p-6">이건 큰 화면에서만 보임</div>

    </section>

    <!-- bootstrap js 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
