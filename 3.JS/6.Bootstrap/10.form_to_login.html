<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container my-4">
        <h2>회원가입</h2>
        <form id="validationForm" novalidate> <!-- 폼의 기본 type chech기능 비활성화. 내가 직접 js로 할 거임.-->
            <!-- 사용자명(아이디) 3~10 글자 -->
            <div class="mb-3">
                <label for="textInput" class="form-label">아이디</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="idInput" name="id" placeholder="아이디를 입력하시오.">
                </div>
                <div class="invalid-feedback">
                    사용자명은 3글자 이상 10글자 이하로 입력해야 합니다.
                </div>
            </div>
            <!-- 비밀번호 대소문자, 숫자, 특수문자 포함하여 8자 이상 입력 -->
            <div class="mb-3">
                <label for="pwInput" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="pwInput" name="pw" placeholder="비밀번호를 입력하시오.">
            </div>

            <div class="mb-3">
                <label for="nameInput" class="form-label">이름</label>
                <input type="text" class="form-control" id="nameInput" name="name" placeholder="이름을 입력하시오.">
            </div>

            <div class="mb-3">
                <label for="dateInput" class="form-label">생년월일 </label>
                <input type="date" class="form-control" id="dateInput" name="birthdate">
            </div>

            <!-- 관심분야 -->
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="checkbox1">
                <label for="checkbox1" class="form-check-label">여기를 체크</label>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="checkbox1">
                <label for="checkbox1" class="form-check-label">여기를 체크</label>
            </div>

    </form>

        <!-- 입력 필드 상태 표시 -->
         <div class="container my-4">
            <form novalidate>
                    <div class="mb-3">
                        <label for="validInput" class="from-control">올바른 입력값 예제</label>
                        <input type="text" class="form-control is-valid" id="validInput" placeholder="This is valid">
                    </div>
                    <div class="mb-3">
                        <label for="validInput" class="from-control">잘못된 입력값 예제</label>
                        <input type="text" class="form-control is-invalid" id="invalidInput" placeholder="This is invalid">
                        <div>올바른 값을 입력하시오</div>
                    </div>
            </form>
         </div>

        <input type="submit">
    </div>
    <script>
        // DoM 요소 가져와서 입력값 검증 후 결과 출력하기
        const form = document.getElementById('validationForm');

        document.getElementById('idInput').addEventListener('blur', validateUsername());
        
        function validateUsername() {
            const userID = document.getElementById('idInput')
            if ((userID.value.length >= 3) & (userID.value.length <= 10)) {
                userID.classList.add('is-valid')
                userID.classList.remove('is-invalid')
            } else {
                userID.classList.add('is-invalid')
            }
        }
    </script>
</body>
</html>
