<div>
  <canvas id="myChart" width="600"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('myChart');

    const data = {
    datasets: [{
        label: 'Scatter Dataset',
        data: [{x: -10, y: 0},
         {x: 0, y: 10},
         {x: 10, y: 5},
         {x: 5, y: 5},
         {x: 7, y: 7},
         {x: 8, y: 3},
         {x: 1, y: 4},
         {x: 0.5, y: 5.5}],
        backgroundColor: 'rgb(255, 99, 132)',
        showLine: true
        }],
        };

    const config = {
        type: 'scatter',
        data: data,
        options: {
            scales: {
            x: {
                type: 'linear', // x값의 타입... linear는 연속형, x값이 범주형이면 category
                position: 'top'
            }
            }
        }
        };

    new Chart(ctx, config)

</script>
