<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버튼 디자인</title>
    <!-- bootstrap css 추가 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <h2> 버튼들 </h2>
    <div class="container my-4">
        <button id="loadButton1" class="btn btn-primary me-2" type="button">
            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            <span class="button-text">데이터 로딩</span>
        </button>
        
        <button id="loadButton2" class="btn btn-secondary me-2" type="button">
            <span class="spinner-border text-danger spinner-border-sm invisible" role="status" aria-hidden="true"></span>
            <span class="button-text">데이터 로딩</span>
        </button>
    </div>

    <!-- bootstrap js 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script>
        const loadButton1 = document.getElementById('loadButton1')
        const spinner1 = loadButton1.querySelector(".spinner-border")
        const buttonText1 = loadButton1.querySelector('.button-text')
        loadButton1.addEventListener('click', ()=> {
            loadButton1.disabled = true;
            buttonText1.textContent = '데이터 로딩 중......'
            spinner1.classList.remove('d-none'); // add, remoce, toggle
        })
    </script>
</body>
</html>
