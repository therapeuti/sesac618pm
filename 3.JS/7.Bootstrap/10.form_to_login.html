<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container my-4">
        <h2>회원가입</h2>
        <form id="validationForm" novalidate> <!-- 폼의 기본 type chech기능 비활성화. 내가 직접 js로 할 거임.-->
            <!-- 사용자명(아이디) 3~10 글자 -->
            <div class="mb-3">
                <label for="textInput" class="form-label">아이디</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="idInput" name="id" placeholder="아이디를 입력하시오.">
                    <div class="invalid-feedback">
                        사용자명은 3글자 이상 10글자 이하로 입력해야 합니다.
                    </div>
                </div>
            </div>
            <!-- 비밀번호 대소문자, 숫자, 특수문자 포함하여 8자 이상 입력 -->
            <div class="mb-3">
                <label for="pwInput" class="form-label">비밀번호</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="pwInput" name="pw" placeholder="비밀번호를 입력하시오.">
                    <div class="invalid-feedback">
                        비밀번호는 대소문자/숫자/특수문자를 모두 포함하여 8자 이상 입력해야 합니다.
                    </div>
                </div>
            </div>
            <!-- 이름 (1-10글자로 입력)-->
            <div class="mb-3">
                <label for="nameInput" class="form-label">이름</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
                    <input type="text" class="form-control" id="nameInput" name="name" placeholder="이름을 입력하시오.">
                    <div class="invalid-feedback">
                        이름은 1글자 이상 10글자 이하로 입력해야 합니다.
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="dateInput" class="form-label">생년월일</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-calendar-date"></i></span>
                    <input type="date" class="form-control" id="dateInput" name="birthdate">
                </div>
            </div>
            
            <!-- 관심분야 -->
            <div class="mb-3">
                <label for="" class="form-label">관심분야(최소 1개, 최대 3개 선택)</label>
                <div class="input-group" id="checkInput">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="checkbox1">
                        <label for="checkbox1" class="form-check-label">여기를 체크</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="checkbox2">
                        <label for="checkbox2" class="form-check-label">여기를 체크</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="checkbox3">
                        <label for="checkbox3" class="form-check-label">여기를 체크</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="checkbox4">
                        <label for="checkbox4" class="form-check-label">여기를 체크</label>
                    </div>
                </div>
                <div class="invalid-feedback">
                    관심분야는 최소 1개 이상, 최대 3개 선택해야 합니다.
                </div>
            </div>
            <input type="submit" id="submit">
        </form>
    </div>

    <script>
        // DoM 요소 가져와서 입력값 검증 후 결과 출력하기
        const form = document.getElementById('validationForm');

        document.getElementById('idInput').addEventListener('blur', validateUsername);
        function validateUsername() {
            const userID = document.getElementById('idInput')
            if ((userID.value.length >= 3) && (userID.value.length <= 10)) {
                userID.classList.add('is-valid')
                userID.classList.remove('is-invalid')
            } else {
                userID.classList.add('is-invalid')
            }
        }

        document.getElementById('pwInput').addEventListener('blur', validatePW)
        function validatePW() {
            const userPW = document.getElementById('pwInput')
            // 정규표현식 true or false로 반환
            const hasUppercase = /[A-Z]/.test(userPW.value)
            const hasNumber = /[0-9]/.test(userPW.value)
            const hasSpecial = /[^A-Za-z0-9]/.test(userPW.value)
            if ((userPW.value.length >= 8) && (hasUppercase) && (hasSpecial) && (hasSpecial)) {
                userPW.classList.add('is-valid')
                userPW.classList.remove('is-invalid')
                
            } else {
                userPW.classList.add('is-invalid')
            }
        }

        document.getElementById('nameInput').addEventListener('blur', validateName)
        function validateName() {
            const userName = document.getElementById('nameInput')
            if ((userName.value.length >= 1) && (userName.value.length <= 10)) {
                userName.classList.add('is-valid')
                userName.classList.remove('is-invalid')

            } else {
                userName.classList.add('is-invalid')
            }
        }

        const checkInput = document.getElementById('checkInput')
        const check = document.querySelectorAll('.form-check-input')
        const submit = document.getElementById('submit')
        // submit.addEventListener('click', validateCheckbox)
        
        
        console.log(check)
        for (chk of check) {
            chk.addEventListener('change', validateCheckbox)
        }
        
        function validateCheckbox() {
            let cnt = 0
            for (chk of check) {
                if (chk.checked) {
                    cnt += 1
                } 
            if (cnt < 1 || cnt > 3){
                for (chk of check) {
                    chk.classList.add('is-invalid')
                }
                checkInput.classList.add('is-invalid')
            } else {
                for (chk of check) {
                    chk.classList.remove('is-invalid')
                }
                checkInput.classList.remove('is-invalid')
            }
            }
        }



    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
